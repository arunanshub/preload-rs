name: Release

on:
  push:
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag and binary version
        if: github.event_name == 'push'
        run: |
          python3 - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          number = r"(0|[1-9][0-9]*)"
          if not re.fullmatch(rf"v{number}\.{number}\.{number}", tag):
              raise SystemExit(f"Expected a stable SemVer tag (v1.2.3), got {tag!r}")
          version = tomllib.loads(Path("crates/cli/Cargo.toml").read_text())["package"]["version"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag!r} does not match preload-rs version {version!r}")
          PY
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.99.0

      - name: Install cross and cosign
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cross@0.2.5,cosign@3.1.3
          fallback: none

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.3
          install-only: true

      - name: Check GoReleaser configuration
        run: goreleaser check

      - name: Build release artifacts
        if: github.event_name == 'push'
        run: goreleaser release --clean --skip=publish

      - name: Build snapshot artifacts
        if: github.event_name == 'pull_request'
        run: goreleaser release --clean --snapshot

      - name: Verify archives and smoke-test both binaries
        run: |
          (cd release && sha256sum --check checksums.txt)
          python3 - <<'PY'
          import subprocess
          import tomllib
          from pathlib import Path

          targets = tomllib.loads(Path("Cross.toml").read_text())["target"]
          for target, config in targets.items():
              binary = Path("target", target, "release", "preload-rs").resolve()
              if target.endswith("musl"):
                  headers = subprocess.check_output(["readelf", "--program-headers", str(binary)], text=True)
                  dynamic = subprocess.check_output(["readelf", "--dynamic", str(binary)], text=True)
                  if "INTERP" in headers or "(NEEDED)" in dynamic:
                      raise SystemExit("musl binary must be statically linked")
              subprocess.run([
                  "docker", "run", "--rm", "--network=none", "--read-only",
                  "--cap-drop=ALL", "--security-opt=no-new-privileges",
                  "--volume", f"{binary}:/preload-rs:ro",
                  "--entrypoint", "/preload-rs", config["image"], "--version",
              ], check=True)
          PY

      - name: Preserve release outputs
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release/*.tar.gz
            release/checksums.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # No checkout, build hooks, or execution of downloaded binaries here.
      - name: Download outputs from this build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release
          merge-multiple: true

      - name: Verify checksums
        working-directory: release
        run: sha256sum --check checksums.txt

      - name: Attest archives and checksums
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            release/*.tar.gz
            release/checksums.txt
          push-to-registry: false
          create-storage-record: false

      - name: Keep the signed provenance bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" release/provenance.sigstore.json

      - name: Install GitHub CLI
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/cli/cli/releases/download/v2.102.0/gh_2.102.0_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/gh.tar.gz"
          echo "bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386  $RUNNER_TEMP/gh.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gh.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gh_2.102.0_linux_amd64/bin" >> "$GITHUB_PATH"

      - name: Verify provenance before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in release/*.tar.gz release/checksums.txt; do
            gh attestation verify "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --bundle release/provenance.sigstore.json \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done

      - name: Publish GitHub Release with all assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "$GITHUB_REF_NAME" --generate-notes \
            release/*.tar.gz release/checksums.txt release/provenance.sigstore.json
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --draft=false
