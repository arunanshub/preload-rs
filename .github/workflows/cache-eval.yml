# Temporary workflow: compares compiler/build caches on the same workload as
# the `build` job in ci.yml. Not meant to be merged as-is.
name: Cache eval

on:
  pull_request:
    paths:
      - ".github/workflows/cache-eval.yml"
      - "crates/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  PROPTEST_CASES: 10000
  # Bump to force every variant back to a cold cache.
  EVAL_SALT: r1

jobs:
  eval:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [none, rust-cache, sccache, kache]

    steps:
      - uses: actions/checkout@v7

      - name: Install mold linker
        uses: rui314/setup-mold@v1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, llvm-tools-preview

      - name: Install cargo-llvm-cov and nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,nextest

      # ---- cache variants -------------------------------------------------
      - name: Setup rust-cache
        if: matrix.variant == 'rust-cache'
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: eval-${{ env.EVAL_SALT }}

      - name: Setup sccache
        if: matrix.variant == 'sccache'
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Enable sccache
        if: matrix.variant == 'sccache'
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_VERSION=eval-${EVAL_SALT}" >> "$GITHUB_ENV"

      - name: Setup kache
        if: matrix.variant == 'kache'
        uses: kunobi-ninja/kache-action@v1
        with:
          version: v2.1.1
          cache-key-prefix: kache-eval-${{ env.EVAL_SALT }}
          cache-executables: "true"
          pr-comment: "false"

      # ---- workload (mirrors ci.yml `build`) -------------------------------
      - name: Check sources
        run: cargo check --workspace --all-features

      - name: Perform linting
        run: cargo clippy --all-targets --all-features

      - name: Run doctests
        run: cargo test --doc --all-features --workspace

      - name: Run tests and generate coverage
        run: cargo llvm-cov --codecov --output-path coverage.cov nextest --all-features --workspace

      - name: Cache stats
        if: always()
        run: |
          case "${{ matrix.variant }}" in
            sccache) sccache --show-stats ;;
            kache) kache stats || true ;;
          esac
